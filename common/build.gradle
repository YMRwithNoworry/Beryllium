architectury {
    common rootProject.enabled_platforms.split(',')
}

def nativeLibraryName = System.mapLibraryName('beryllium_native')
def cubeclLibraryName = System.mapLibraryName('beryllium_cubecl')
def nativeOsName = System.getProperty('os.name').toLowerCase()
def nativeArchName = System.getProperty('os.arch').toLowerCase()
def nativeResourceOs = nativeOsName.contains('win') ? 'windows' : (nativeOsName.contains('mac') || nativeOsName.contains('darwin') ? 'macos' : 'linux')
def nativeResourceArch = (nativeArchName == 'amd64' || nativeArchName == 'x86_64') ? 'x86_64' : (nativeArchName == 'aarch64' || nativeArchName == 'arm64' ? 'aarch64' : nativeArchName)
def nativeGeneratedResources = file("$buildDir/generated/nativeResources")
def cubeclPreviewEnabled = providers.gradleProperty('berylliumCubeclPreview')
        .map { it.toBoolean() }
        .getOrElse(false)

tasks.register('cargoBuildNative', Exec) {
    workingDir rootProject.file('native')
    def cargoArguments = ['build', '--release', '--locked', '--package', 'beryllium-native']
    if (cubeclPreviewEnabled) {
        cargoArguments.addAll([
            '--package', 'beryllium-cubecl',
            '--features', 'beryllium-native/cubecl-preview'
        ])
    }
    commandLine 'cargo', *cargoArguments

    inputs.files fileTree(rootProject.file('native')) {
        include 'Cargo.toml'
        include 'Cargo.lock'
        include 'crates/**'
        exclude 'target/**'
    }
    inputs.file rootProject.file('rust-toolchain.toml')
    inputs.property 'cubeclPreviewEnabled', cubeclPreviewEnabled
    outputs.file rootProject.file("native/target/release/${nativeLibraryName}")
    if (cubeclPreviewEnabled) {
        outputs.file rootProject.file("native/target/release/${cubeclLibraryName}")
    }
}

tasks.register('copyNativeLibrary', Sync) {
    dependsOn tasks.named('cargoBuildNative')
    from(rootProject.file('native/target/release')) {
        include nativeLibraryName
        if (cubeclPreviewEnabled) {
            include cubeclLibraryName
        }
    }
    into file("${nativeGeneratedResources}/assets/beryllium/native/${nativeResourceOs}/${nativeResourceArch}")
}

sourceSets.main.resources.srcDir nativeGeneratedResources
processResources.dependsOn tasks.named('copyNativeLibrary')
tasks.withType(Jar).configureEach {
    dependsOn tasks.named('copyNativeLibrary')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

tasks.withType(Test).configureEach {
    enabled = false
}

tasks.register('javaParityTest', JavaExec) {
    description = 'Runs Java parity checks without Loom test runner interference.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    mainClass = 'alku.beryllium.verify.BerylliumParityVerifier'
    classpath = sourceSets.test.runtimeClasspath + files(sourceSets.test.output.classesDirs)
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('nativeRuntimeTest', JavaExec) {
    description = 'Requires the bundled native backend to load and executes every FFM entry point.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    mainClass = 'alku.beryllium.verify.BerylliumNativeRuntimeVerifier'
    classpath = sourceSets.test.runtimeClasspath + files(sourceSets.test.output.classesDirs)
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('ffmReuseTest', JavaExec) {
    description = 'Verifies thread-local FFM session reuse and concurrent buffer isolation.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    mainClass = 'alku.beryllium.bridge.FfmNativeBridgeVerifier'
    classpath = sourceSets.test.runtimeClasspath + files(sourceSets.test.output.classesDirs)
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('inputLatencyStateTest', JavaExec) {
    description = 'Verifies immediate input flushing preserves vanilla per-tick action semantics.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    mainClass = 'alku.beryllium.client.InputLatencyGateVerifier'
    classpath = sourceSets.test.runtimeClasspath + files(sourceSets.test.output.classesDirs)
}

tasks.register('performanceBenchmark', JavaExec) {
    description = 'Measures nearest-item, chunk, potential, and native entity-filter paths.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    mainClass = 'alku.beryllium.verify.BerylliumPerformanceBenchmark'
    classpath = sourceSets.test.runtimeClasspath + files(sourceSets.test.output.classesDirs)
    jvmArgs '--enable-native-access=ALL-UNNAMED', '-Dberyllium.native.nearestItemTopKThreshold=1'
}

check.dependsOn tasks.named('javaParityTest')
check.dependsOn tasks.named('nativeRuntimeTest')
check.dependsOn tasks.named('ffmReuseTest')
check.dependsOn tasks.named('inputLatencyStateTest')
